  <!-- Footer Info Bar -->
  <line x1="100" y1="510" x2="1100" y2="510" stroke="#334155" stroke-width="1" />
  <text x="100" y="560" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="500">
    🔒 Data rekening dan keuangan tidak pernah meninggalkan browser Anda
  </text>
  <text x="1100" y="560" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="end">
