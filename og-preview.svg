    <text x="60" y="52" fill="#94a3b8" font-family="sans-serif" font-size="13">Tanpa Database</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="240" height="74" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="274" cy="37" r="14" fill="#0ea5e9" opacity="0.2" />
    <text x="274" y="42" fill="#0ea5e9" font-family="sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="300" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="700">5-Layer Classifier</text>
    <text x="300" y="52" fill="#94a3b8" font-family="sans-serif" font-size="13">Tail, Keyword, Donor</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="220" height="74" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="534" cy="37" r="14" fill="#8b5cf6" opacity="0.2" />
    <text x="534" y="42" fill="#8b5cf6" font-family="sans-serif" font-size="18" text-anchor="middle">🤖</text>
    <text x="560" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="700">AI Assisted</text>
    <text x="560" y="52" fill="#94a3b8" font-family="sans-serif" font-size="13">Ollama / Gemini / API</text>

    <!-- Badge 4 -->
    <rect x="740" y="0" width="240" height="74" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="774" cy="37" r="14" fill="#f59e0b" opacity="0.2" />
