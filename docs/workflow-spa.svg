<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="100%" height="290">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(19, 30, 49, 0.95)" />
      <stop offset="100%" stop-color="rgba(11, 18, 32, 0.85)" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .wf-font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .node-title { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .node-desc { font-size: 11.5px; fill: #94a3b8; line-height: 1.3; }
    .badge-text { font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="290" rx="16" fill="url(#wfBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="5" fill="#38bdf8" />
    <text x="20" y="10" class="wf-font" font-size="14" font-weight="700" fill="#f8fafc">Alur &amp; Struktur Halaman Aplikasi</text>
    <text x="260" y="10" class="wf-font" font-size="12" fill="#64748b">Client-Side Static Architecture · Zero Server</text>
  </g>

  <!-- Node 1: Landing Page -->
  <g transform="translate(30, 65)" filter="url(#shadow)">
    <rect width="200" height="185" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="14" y="14" width="32" height="32" rx="8" fill="rgba(56, 189, 248, 0.15)" />
    <!-- Web / Landing Icon -->
    <path d="M22 30 H38 M30 22 V38 M30 22 C26 25 24 28 24 30 C24 32 26 35 30 38 C34 35 36 32 36 30 C36 28 34 25 30 22 Z" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    
    <text x="56" y="27" class="wf-font badge-text">ENTRY POINT</text>
    <text x="56" y="42" class="wf-font node-title">index.html</text>
    
    <line x1="14" y1="58" x2="186" y2="58" stroke="#1e293b" stroke-width="1" />
    
    <text x="14" y="80" class="wf-font node-title" font-size="13">Landing Page</text>
    <text x="14" y="100" class="wf-font node-desc">• Edukasi &amp; Masalah Amil</text>
    <text x="14" y="118" class="wf-font node-desc">• Preview Pipeline 5-Lapis</text>
    <text x="14" y="136" class="wf-font node-desc">• Komparasi Demo vs Full</text>
    <text x="14" y="154" class="wf-font node-desc">• Matriks Tata Kelola (RBAC)</text>
    
    <rect x="14" y="166" width="172" height="20" rx="4" fill="rgba(56, 189, 248, 0.1)" />
    <text x="100" y="180" class="wf-font" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Route: / (Root)</text>
  </g>

  <!-- Arrow: Landing to App -->
  <g transform="translate(230, 145)">
    <line x1="10" y1="12" x2="50" y2="12" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="50,7 60,12 50,17" fill="#38bdf8" />
    <text x="35" y="3" class="wf-font" font-size="9.5" font-weight="600" fill="#94a3b8" text-anchor="middle">CTA Click</text>
  </g>

  <!-- Container Node: App SPA Workflow -->
  <g transform="translate(300, 65)" filter="url(#shadow)">
    <rect width="590" height="185" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Top Bar inside App SPA -->
    <rect x="14" y="12" width="28" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" />
    <path d="M22 26 L26 30 L34 22" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="23" class="wf-font badge-text" fill="#10b981">MAIN APPLICATION</text>
    <text x="50" y="38" class="wf-font node-title">app.html — Converter &amp; Rekonsiliasi ZISWAF</text>
    
    <rect x="470" y="16" width="105" height="20" rx="4" fill="rgba(16, 185, 129, 0.1)" />
    <text x="522" y="30" class="wf-font" font-size="10.5" font-weight="600" fill="#10b981" text-anchor="middle">Route: /app</text>
    
    <line x1="14" y1="48" x2="576" y2="48" stroke="#1e293b" stroke-width="1" />

    <!-- Step 1 Card -->
    <g transform="translate(14, 58)">
      <rect width="175" height="112" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="18" r="9" fill="#0284c7" />
      <text x="20" y="22" class="wf-font" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="36" y="22" class="wf-font" font-size="12" font-weight="700" fill="#f8fafc">Konfigurasi</text>
      
      <text x="12" y="44" class="wf-font node-desc">• Master COA &amp; Akun</text>
      <text x="12" y="60" class="wf-font node-desc">• Program &amp; Kode Ekor</text>
      <text x="12" y="76" class="wf-font node-desc">• Donatur &amp; Alias Yayasan</text>
      <text x="12" y="92" class="wf-font node-desc">• Model AI &amp; API Key Sesi</text>
    </g>

    <!-- Connector Arrow Step 1 to Step 2 -->
    <g transform="translate(189, 108)">
      <line x1="4" y1="6" x2="16" y2="6" stroke="#475569" stroke-width="1.5" />
      <polygon points="16,3 22,6 16,9" fill="#475569" />
    </g>

    <!-- Step 2 Card -->
    <g transform="translate(211, 58)">
      <rect width="175" height="112" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="18" r="9" fill="#0284c7" />
      <text x="20" y="22" class="wf-font" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="36" y="22" class="wf-font" font-size="12" font-weight="700" fill="#f8fafc">Upload Mutasi</text>
      
      <text x="12" y="44" class="wf-font node-desc">• Drag &amp; drop Excel/CSV</text>
      <text x="12" y="60" class="wf-font node-desc">• Auto-detect kolom bank</text>
      <text x="12" y="76" class="wf-font node-desc">• Eksekusi 5-Layer Engine</text>
      <text x="12" y="92" class="wf-font node-desc">• Proses &lt;10 detik lokal</text>
    </g>

    <!-- Connector Arrow Step 2 to Step 3 -->
    <g transform="translate(386, 108)">
      <line x1="4" y1="6" x2="16" y2="6" stroke="#475569" stroke-width="1.5" />
      <polygon points="16,3 22,6 16,9" fill="#475569" />
    </g>

    <!-- Step 3 Card -->
    <g transform="translate(408, 58)">
      <rect width="168" height="112" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="18" r="9" fill="#10b981" />
      <text x="20" y="22" class="wf-font" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="36" y="22" class="wf-font" font-size="12" font-weight="700" fill="#f8fafc">Dashboard</text>
      
      <text x="12" y="44" class="wf-font node-desc">• Filter status &amp; multilayer</text>
      <text x="12" y="60" class="wf-font node-desc">• Koreksi COA &amp; massal</text>
      <text x="12" y="76" class="wf-font node-desc">• Ringkasan dana &amp; chart</text>
      <text x="12" y="92" class="wf-font node-desc">• Ekspor Jurnal SIAK/XLSX</text>
    </g>
  </g>
</svg>